<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings ESM build</title>
    <script type="importmap">
      {
        "imports": {
          "vue": "/vue-esm.js"
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #fafafa;
        color: #18181b;
      }
      .box {
        text-align: center;
      }
      button {
        border: 1px solid #d4d4d8;
        background: #fff;
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>ESM build</h1>
      <p>从 <code>/settings-dist/auto.mjs</code> 导入，自动注入样式。</p>
      <button id="open" type="button">打开设置</button>
    </div>

    <script type="module">
      import { createSettings } from '/settings-dist/auto.mjs'

      const settings = createSettings({
        version: 'esm-demo',
        tabs: [
          {
            id: 'demo',
            title: 'ESM Demo',
            groups: [
              {
                id: 'demo',
                title: 'Fields',
                defaultOpen: true,
                fields: [
                  { type: 'switch', key: 'enabled', label: 'Enabled', default: true },
                  { type: 'range', key: 'width', label: 'Width', default: 4, min: 1, max: 10 }
                ]
              }
            ]
          }
        ]
      })
      document.querySelector('#open').addEventListener('click', () => settings.open())
      window.__settings = settings
    </script>
  </body>
</html>
