<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings IIFE build</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #fafafa;
        color: #18181b;
      }
      .box {
        text-align: center;
      }
      button {
        border: 1px solid #d4d4d8;
        background: #fff;
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>IIFE build</h1>
      <p>
        加载 <code>userscript-settings.iife.js</code>，通过全局
        <code>UserscriptSettings</code> 使用。
      </p>
      <button id="open" type="button">打开设置</button>
    </div>

    <script src="/settings-iife.js"></script>
    <script>
      const { createSettings } = window.UserscriptSettings
      const settings = createSettings({
        version: 'iife-demo',
        tabs: [
          {
            id: 'demo',
            title: 'IIFE Demo',
            groups: [
              {
                id: 'demo',
                title: 'Fields',
                defaultOpen: true,
                fields: [
                  { type: 'switch', key: 'enabled', label: 'Enabled', default: true },
                  { type: 'shortcut', key: 'shortcut', label: 'Shortcut', default: 'Alt+Shift+S' },
                  {
                    type: 'select',
                    key: 'mode',
                    label: 'Mode',
                    default: 'a',
                    options: [
                      { value: 'a', label: 'Alpha' },
                      { value: 'b', label: 'Beta' }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      })
      document.querySelector('#open').addEventListener('click', () => settings.open())
      window.__settings = settings
    </script>
  </body>
</html>
